[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dpx-erlang"
version = "0.1.0"
description = "🔴 DPX-Erlang: OTP Architecture & Design Pattern Scanner for Erlang / OTP (OTP 20 - 27+)"
readme = "README.md"
authors = [
    { name = "Bivex Team", email = "dev@bivex.io" }
]
license = "MIT"
keywords = [
    "erlang",
    "otp",
    "gen_server",
    "supervisor",
    "gen_statem",
    "design-patterns",
    "static-analysis",
    "architecture",
    "actor-model",
    "let-it-crash",
    "sarif",
    "hexagonal-architecture",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Compilers",
]
requires-python = ">=3.10"
dependencies = [
    "antlr4-python3-runtime>=4.13.2",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
dpx = "pattern_detector.adapters.inbound.cli.main:main"
dpx-erlang = "pattern_detector.adapters.inbound.cli.main:main"

[dependency-groups]
dev = [
    "hatchling>=1.24.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pattern_detector"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
